name: Publish Android App

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              printf '::error::GitHub Actions secret %s is missing.\n' "$variable"
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Prepare release metadata
        run: |
          set -euo pipefail

          APP_VERSION="$(python3 -c "import re; print(re.search(r'^version:\\s*([^+\\s]+)', open('pubspec.yaml').read(), re.M).group(1))")"
          PUBSPEC_BUILD="$(python3 -c "import re; print(re.search(r'^version:\\s*[^+\\s]+\\+(\\d+)', open('pubspec.yaml').read(), re.M).group(1))")"
          BUILD_NUMBER="$((PUBSPEC_BUILD + GITHUB_RUN_NUMBER))"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="mobile-v${APP_VERSION}-build.${BUILD_NUMBER}-${SHORT_SHA}"
          fi
          ASSET_NAME="koyomi-gal-${APP_VERSION}-${BUILD_NUMBER}-${SHORT_SHA}.apk"

          printf 'APP_VERSION=%s\n' "$APP_VERSION" >> "$GITHUB_ENV"
          printf 'BUILD_NUMBER=%s\n' "$BUILD_NUMBER" >> "$GITHUB_ENV"
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          printf 'ASSET_NAME=%s\n' "$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --build-name "$APP_VERSION" \
            --build-number "$BUILD_NUMBER"

          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$ASSET_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK_PATH="build/app/outputs/flutter-apk/$ASSET_NAME"
          CHECKSUM_PATH="${APK_PATH}.sha256"
          (
            cd "$(dirname "$APK_PATH")"
            sha256sum "$(basename "$APK_PATH")" > "$(basename "$CHECKSUM_PATH")"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" "$CHECKSUM_PATH" \
              --target "$GITHUB_SHA" \
              --title "Koyomi Gal Android ${APP_VERSION} (build ${BUILD_NUMBER})" \
              --generate-notes
          fi
