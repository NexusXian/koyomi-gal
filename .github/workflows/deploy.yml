name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy backend to server
    runs-on: ubuntu-latest
    concurrency: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Build linux/amd64 binaries
        working-directory: apps/backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/server.new ./cmd/server
          go build -trimpath -ldflags='-s -w' -o dist/worker.new ./cmd/worker

      - name: Upload binaries
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "apps/backend/dist/*"
          target: "/opt/koyomi"
          strip_components: 3

      - name: Switch binaries and restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu

            cd /opt/koyomi

            mv server.new server
            mv worker.new worker

            chmod +x server worker

            sudo systemctl restart koyomi-server
            sudo systemctl restart koyomi-worker

            sudo systemctl is-active koyomi-server
            sudo systemctl is-active koyomi-worker

  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    concurrency: deploy-frontend

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
        env:
          NITRO_PRESET: cloudflare-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          command: pages deploy .output/public --project-name=${{ secrets.CF_PAGES_PROJECT }} --branch=master
