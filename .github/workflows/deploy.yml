name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # =========================
  # Backend
  # =========================
  deploy-backend:
    name: Deploy backend to server
    runs-on: ubuntu-latest
    concurrency: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Build linux/amd64 binaries
        working-directory: apps/backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist

          go build \
            -trimpath \
            -ldflags='-s -w' \
            -o dist/server.new \
            ./cmd/server

          go build \
            -trimpath \
            -ldflags='-s -w' \
            -o dist/worker.new \
            ./cmd/worker

      - name: Upload binaries
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "apps/backend/dist/*"
          target: "/opt/koyomi"
          strip_components: 3

      - name: Switch binaries and restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu

            cd /opt/koyomi

            mv server.new server
            mv worker.new worker

            chmod +x server worker

            systemctl restart koyomi-server
            systemctl restart koyomi-worker

            systemctl is-active koyomi-server
            systemctl is-active koyomi-worker

  # =========================
  # Frontend
  # =========================
  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    concurrency: deploy-frontend

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for Cloudflare Pages
        run: pnpm exec nuxi build --preset=cloudflare_pages

      - name: Check build output
        run: |
          echo "===== dist ====="
          ls -lah dist

          echo "===== dist files ====="
          find dist -maxdepth 2 -type f | head -100

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT }} --branch=master
