basePath: /
definitions:
  dto.AuthSession:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.AuthUser'
    type: object
  dto.AuthSessionResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/dto.AuthSession'
      msg:
        example: success
        type: string
    type: object
  dto.AuthUser:
    properties:
      avatar:
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: 1
        type: integer
      username:
        example: koyomi
        type: string
    type: object
  dto.CreatePermissionRequest:
    properties:
      code:
        example: user:delete
        maxLength: 64
        type: string
      description:
        example: 允许删除用户
        maxLength: 255
        type: string
      name:
        example: 删除用户
        maxLength: 64
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateRoleRequest:
    properties:
      code:
        example: admin
        maxLength: 64
        type: string
      description:
        example: 管理员角色
        maxLength: 255
        type: string
      name:
        example: 管理员
        maxLength: 64
        type: string
    required:
    - code
    - name
    type: object
  dto.MePermissionsData:
    properties:
      permissions:
        example:
        - user:list
        - user:delete
        items:
          type: string
        type: array
      roles:
        example:
        - admin
        items:
          type: string
        type: array
    type: object
  dto.MePermissionsResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/dto.MePermissionsData'
      msg:
        example: success
        type: string
    type: object
  dto.PermissionListResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        items:
          $ref: '#/definitions/dto.PermissionResponse'
        type: array
      msg:
        example: success
        type: string
    type: object
  dto.PermissionResponse:
    properties:
      action:
        example: delete
        type: string
      code:
        example: user:delete
        type: string
      created_at:
        type: string
      description:
        example: 允许删除用户
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 删除用户
        type: string
      resource:
        example: user
        type: string
      updated_at:
        type: string
    type: object
  dto.RoleListResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        items:
          $ref: '#/definitions/dto.RoleResponse'
        type: array
      msg:
        example: success
        type: string
    type: object
  dto.RoleResponse:
    properties:
      code:
        example: admin
        type: string
      created_at:
        type: string
      description:
        example: 管理员角色
        type: string
      id:
        example: 1
        type: integer
      name:
        example: 管理员
        type: string
      updated_at:
        type: string
    type: object
  dto.SendVerificationCodeRequest:
    properties:
      email:
        example: user@example.com
        maxLength: 254
        type: string
      purpose:
        enum:
        - register
        - password_reset
        example: register
        type: string
    required:
    - email
    - purpose
    type: object
  dto.UpdatePermissionRequest:
    properties:
      description:
        example: 允许删除用户
        maxLength: 255
        type: string
      name:
        example: 删除用户
        maxLength: 64
        type: string
    required:
    - name
    type: object
  dto.UpdateRolePermissionsRequest:
    properties:
      permission_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - permission_ids
    type: object
  dto.UpdateRoleRequest:
    properties:
      description:
        example: 管理员角色
        maxLength: 255
        type: string
      name:
        example: 管理员
        maxLength: 64
        type: string
    required:
    - name
    type: object
  dto.UpdateUserRolesRequest:
    properties:
      role_ids:
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
    required:
    - role_ids
    type: object
  dto.UserLoginRequest:
    properties:
      account:
        example: user@example.com
        maxLength: 254
        type: string
      password:
        example: password123
        maxLength: 255
        minLength: 8
        type: string
    required:
    - account
    - password
    type: object
  dto.UserRegisterRequest:
    properties:
      confirm_password:
        example: password123
        maxLength: 255
        minLength: 8
        type: string
      email:
        example: user@example.com
        maxLength: 254
        type: string
      password:
        example: password123
        maxLength: 255
        minLength: 8
        type: string
      username:
        example: koyomi
        maxLength: 50
        type: string
      verification_code:
        example: "123456"
        type: string
    required:
    - confirm_password
    - email
    - password
    - username
    - verification_code
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  response.ErrorResponse:
    properties:
      code:
        example: 233
        type: integer
      msg:
        example: 业务错误
        type: string
    type: object
  response.MessageResponse:
    properties:
      code:
        example: 0
        type: integer
      msg:
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Koyomi Gal 后端 API
  title: Koyomi Gal API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 校验邮箱或用户名和密码，返回 Access Token 与用户信息，并通过 Set-Cookie 写入 HttpOnly 的
        Refresh Token
      operationId: login
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              description: HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth 的 refresh_token
                Cookie
              type: string
          schema:
            $ref: '#/definitions/dto.AuthSessionResponse'
        "400":
          description: 账号或密码格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 账号或密码错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 账号已封禁
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 认证服务异常
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 用户登录
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 撤销刷新会话并清除 refresh_token Cookie
      operationId: logout
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          headers:
            Set-Cookie:
              description: 已过期的 refresh_token Cookie
              type: string
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: Refresh Token 格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 退出登录失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 退出登录
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: 使用 refresh_token Cookie 轮换 Refresh Token，返回新的 Access Token 与用户信息
      operationId: refreshSession
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          headers:
            Set-Cookie:
              description: 轮换后的 refresh_token Cookie
              type: string
          schema:
            $ref: '#/definitions/dto.AuthSessionResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 账号已封禁
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 认证服务异常
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 刷新登录会话
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 使用邮箱验证码创建新账号
      operationId: register
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 用户注册成功
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 用户注册失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 用户注册
      tags:
      - auth
  /api/v1/auth/verification-codes:
    post:
      consumes:
      - application/json
      description: 创建验证码邮件任务，202 表示任务已入队，不代表邮件已送达
      operationId: sendVerificationCode
      parameters:
      - description: 发送验证码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendVerificationCodeRequest'
      produces:
      - application/json
      responses:
        "202":
          description: 验证码发送任务已创建
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: 邮箱或验证码用途格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 验证码发送任务创建失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 发送邮箱验证码
      tags:
      - verification
  /api/v1/me/permissions:
    get:
      description: 返回当前登录用户的角色 code 与权限 code 集合，用于前端控制 UI 展示
      operationId: getMePermissions
      produces:
      - application/json
      responses:
        "200":
          description: 当前用户角色与权限
          schema:
            $ref: '#/definitions/dto.MePermissionsResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 查询用户权限失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查看当前用户权限
      tags:
      - me
  /api/v1/permissions:
    get:
      description: 返回全部权限
      operationId: listPermissions
      produces:
      - application/json
      responses:
        "200":
          description: 权限列表
          schema:
            $ref: '#/definitions/dto.PermissionListResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 查询权限失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查看权限列表
      tags:
      - permissions
    post:
      consumes:
      - application/json
      description: 创建新权限，code 必须为 resource:action 格式且全局唯一，创建后不可修改
      operationId: createPermission
      parameters:
      - description: 创建权限请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/dto.PermissionResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: 权限 code 已存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 创建权限失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建权限
      tags:
      - permissions
  /api/v1/permissions/{id}:
    delete:
      description: 删除权限并清理角色权限关联
      operationId: deletePermission
      parameters:
      - description: 权限 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 权限已删除
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: 权限 ID 格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 删除权限失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除权限
      tags:
      - permissions
    put:
      consumes:
      - application/json
      description: 更新权限名称和描述，code/resource/action 不可修改
      operationId: updatePermission
      parameters:
      - description: 权限 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新权限请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/dto.PermissionResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 权限不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 更新权限失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新权限
      tags:
      - permissions
  /api/v1/roles:
    get:
      description: 返回全部角色
      operationId: listRoles
      produces:
      - application/json
      responses:
        "200":
          description: 角色列表
          schema:
            $ref: '#/definitions/dto.RoleListResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 查询角色失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查看角色列表
      tags:
      - roles
    post:
      consumes:
      - application/json
      description: 创建新角色，code 全局唯一且创建后不可修改
      operationId: createRole
      parameters:
      - description: 创建角色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/dto.RoleResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: 角色 code 已存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 创建角色失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建角色
      tags:
      - roles
  /api/v1/roles/{id}:
    delete:
      description: 删除角色并清理用户角色、角色权限关联，超级管理员角色不可删除
      operationId: deleteRole
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 角色已删除
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: 角色 ID 格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: 角色受保护，不允许删除
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 删除角色失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除角色
      tags:
      - roles
    get:
      description: 按角色 ID 返回角色详情
      operationId: getRole
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 角色详情
          schema:
            $ref: '#/definitions/dto.RoleResponse'
        "400":
          description: 角色 ID 格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 查询角色失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查看角色详情
      tags:
      - roles
    put:
      consumes:
      - application/json
      description: 更新角色名称和描述，code 不可修改
      operationId: updateRole
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新角色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/dto.RoleResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 更新角色失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新角色
      tags:
      - roles
  /api/v1/roles/{id}/permissions:
    get:
      description: 返回角色当前拥有的全部权限
      operationId: getRolePermissions
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 权限列表
          schema:
            $ref: '#/definitions/dto.PermissionListResponse'
        "400":
          description: 角色 ID 格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 角色不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 查询角色权限失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查看角色权限
      tags:
      - roles
    put:
      consumes:
      - application/json
      description: 全量替换角色拥有的权限集合
      operationId: updateRolePermissions
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新角色权限请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRolePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
