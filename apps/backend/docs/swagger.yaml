host: localhost:8080
info:
  contact: {}
  description: Koyomi Gal 后端 API
  title: Koyomi Gal API
  version: 1.0.0
paths:
  /api/v1/admin/articles:
    get:
      description: 分页返回全部文章；需要 article:read 权限
      operationId: listAdminArticles
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量，最大 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 文章列表
          schema:
            $ref: '#/definitions/dto.AdminArticleListResponse'
        "400":
          description: 查询参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 管理端查询文章
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 创建草稿或文章；设置发布时间还需要 article:publish 权限
      operationId: createAdminArticle
      parameters:
      - description: 创建文章请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateArticleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/dto.ArticleDataResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - admin
  /api/v1/admin/articles/{id}:
    delete:
      description: 删除文章；需要 article:delete 权限
      operationId: deleteAdminArticle
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 文章已删除
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除文章
      tags:
      - admin
    get:
      description: 按 ID 返回任意发布状态的文章；需要 article:read 权限
      operationId: getAdminArticle
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 文章详情
          schema:
            $ref: '#/definitions/dto.ArticleDataResponse'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 管理端查看文章
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: 全量更新；内容变更需要 article:update，发布时间变更需要 article:publish
      operationId: updateAdminArticle
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新文章请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateArticleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/dto.ArticleDataResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新文章
      tags:
      - admin
  /api/v1/admin/background-presets:
    get:
      description: 分页返回全部背景预设；需要 background_preset:read 权限
      operationId: listAdminBackgroundPresets
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量，最大 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 背景预设列表
          schema:
            $ref: '#/definitions/dto.AdminBackgroundPresetListResponse'
        "400":
          description: 查询参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 查询背景预设失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 管理端查询背景预设
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 创建背景预设；需要 background_preset:create 权限
      operationId: createAdminBackgroundPreset
      parameters:
      - description: 创建背景预设请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBackgroundPresetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/dto.BackgroundPresetDataResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建背景预设
      tags:
      - admin
  /api/v1/admin/background-presets/{id}:
    delete:
      description: 删除背景预设；需要 background_preset:delete 权限
      operationId: deleteAdminBackgroundPreset
      parameters:
      - description: 背景预设 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 背景预设已删除
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: 背景预设 ID 格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 背景预设不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除背景预设
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: 全量更新背景预设；需要 background_preset:update 权限
      operationId: updateAdminBackgroundPreset
      parameters:
      - description: 背景预设 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新背景预设请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateBackgroundPresetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/dto.BackgroundPresetDataResponse'
        "400":
          description: 请求参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 背景预设不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新背景预设
      tags:
      - admin
  /api/v1/admin/banners:
    get:
      description: 分页返回全部 Banner；需要 banner:read 权限
      operationId: listAdminBanners
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量，最大 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Banner 列表
          schema:
            $ref: '#/definitions/dto.AdminBannerListResponse'
        "400":
          description: 查询参数格式不正确
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 用户登录失效
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 没有执行该操作的权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 查询 Banner 失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 管理端查询 Banner
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 创建首页 Banner；需要 banner:create 权限
      operationId: createAdminBanner
      parameters:
      - description: 创建 Banner 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBannerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/dto.BannerDataResponse'
        "400":
          description: 请求参数格式不正确
          schema:
